[project]
name = "reqcheck"
version = "0.1.0"
description = "ИИ-агент статического ревью документов требований (ISO/IEC/IEEE 29148, IEEE 830)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1,<4",
    "openai>=3.59,<4",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.16,<3",
    "pymupdf4llm>=2.1,<3",
    "pyyaml>=6.0,<7",
    "rapidfuzz>=3.14,<4",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.165,<1",
    "python-multipart>=0.0.34",
    "uvicorn>=0.54,<1",
]
docx = [
    "python-docx>=1.2,<2",
]

[project.scripts]
reqcheck = "reqcheck.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.2,<10",
    "ruff>=0.17,<1",
]

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
filterwarnings = [
    # SWIG-обёртки PyMuPDF на Python 3.12: шум, не наша ошибка
    "ignore:builtin type .* has no __module__ attribute:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
