# Ожидаемые находки для eval (docs/02-trd.md, §10). Формат записи:
#   id        — метка дефекта в таблицах eval
#   category  — основная категория находки (Category из reqcheck/schemas/common.py)
#   accept    — допустимые синонимы категории: находка с другой категорией, но на том же месте
#               считается верной (граница между категориями размыта: «быстро» — это и
#               неоднозначность, и непроверяемость)
#   quotes    — цитаты-якоря: короткие дословные фрагменты текста документа (проверяются при
#               генерации). Якорь — только суть дефекта: находка может цитировать больше (контекст),
#               и пересечение считается, когда короткая цитата целиком лежит в длинной
#   sections  — вместо quotes, для missing_topic и traceability (нет места в тексте): находка
#               должна лежать в одном из названных разделов; "*" — подходит любое место документа
#   min_quotes — сколько цитат находка должна покрыть (по умолчанию 1)
# Уровень фикстуры: split — dev (на нём настраиваем) или holdout (только отчёт), path — путь к
# документу, если он не лежит рядом под именем фикстуры.
# Сопоставление: категория и partial_ratio цитат >= 80 либо раздел (reqcheck/eval/matching.py).
# Разметка корпуса — чтение автором фикстур; документы общие, ничего от документа организаторов.
