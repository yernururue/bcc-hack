# Словари для проверок кодом (этап check_each, часть «правила»).
# Шаблоны — регулярные выражения Python, ищутся без учёта регистра по границам слов.
# Только общие слова языка требований, без привязки к конкретному документу.

vague:
  category: ambiguous
  characteristic: unambiguous
  explanation: >-
    Оборот «{match}» не задаёт измеримого критерия: разные читатели поймут его по-разному,
    а тестировщик не сможет однозначно решить, выполнено ли требование.
  patterns:
    - 'быстр\w*'
    - 'оперативн\w*'
    - 'своевременн\w*'
    - 'незамедлительн\w*'
    - 'удобн\w*'
    - 'интуитивн\w*'
    - 'понятн\w*'
    - 'простой|простая|простое|просто'
    - 'эффективн\w*'
    - 'гибк\w*'
    - 'надёжн\w*|надежн\w*'
    - 'современн\w*'
    - 'достаточн\w*'
    - 'значительн\w*'
    - 'приемлем\w*'
    - 'оптимальн\w*'
    - 'по возможности'
    - 'при необходимости'
    - 'как правило'
    - 'и т\.\s?д\.?'
    - 'и т\.\s?п\.?'
    - 'и прочее|и др\.'
    - 'user[- ]friendly'
    - 'fast|quickly|easy to use|as appropriate|if necessary|etc\.?'

tbd:
  category: incomplete
  characteristic: complete
  explanation: >-
    Пометка «{match}» означает, что содержание не определено: по такому пункту нельзя
    ни реализовать, ни проверить требование.
  patterns:
    - 'TBD|TBA|TBC'
    - 'уточняется|уточнить позже|будет уточнен\w*'
    - 'будет определен\w*|определяется позже'
    - 'заполняется|заполняются'
    - '\?\?\?|XXX'

# Сколько слов слева и справа от совпадения брать в цитату правила.
quote_context_words: 3
