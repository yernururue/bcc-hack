# Пороги вердикта и проверок (docs/02-trd.md, §5). Вердикт считает код, а не модель (ADR-003).

verdict:
  # «Нельзя начинать разработку», если блокирующих находок не меньше этого числа
  block_development_if_blockers_at_least: 1
  # «Можно с оговорками», если блокирующих нет, а существенных не меньше этого числа
  caution_if_major_at_least: 3
  # «Нельзя начинать тест-дизайн», если есть непроверяемые требования или нет критериев приёмки
  block_testing_if_unverifiable_at_least: 1
  block_testing_if_no_acceptance: true

verify:
  # Минимальное сходство цитаты с текстом документа (rapidfuzz partial_ratio, 0–100)
  quote_min_similarity: 90

check_each:
  batch_size: 15

check_set:
  duplicate_min_similarity: 85

# Фильтр шума: что не попадает в отчёт (остаётся в debug.suppressed_findings JSON-отчёта)
findings_filter:
  # Максимум находок на одно требование; лишние — с наименьшей серьёзностью
  max_per_requirement: 3
  # «Неясно» с серьёзностью не выше этой в отчёт не выводим. Только minor: сильные модели часто
  # оформляют настоящие дефекты как «неясно» (major), и они на вердикт не влияют, но и терять их нельзя
  drop_unclear_up_to: minor
  # Находки набора: не больше N на категорию (остальные — в debug.suppressed_findings)
  max_set_per_category:
    missing_topic: 3
    terminology: 2
    traceability: 1

# Оценка качества (python -m reqcheck.eval, docs/02-trd.md §10)
eval:
  # Находка попадает на ожидаемое место, если partial_ratio цитат (0–100) не ниже порога
  quote_overlap: 80
  # Цитату короче этого числа символов (после нормализации) на сопоставление не берём
  min_quote_chars: 6

report:
  max_questions: 10
  max_top_fixes: 5

# Серьёзность по умолчанию для категорий (модель может повысить с объяснением)
default_severity:
  ambiguous: major
  unverifiable: blocker
  incomplete: major
  composite: minor
  design_decision: minor
  infeasible: major
  incorrect: major
  unnecessary: minor
  nonconforming: minor
  contradiction: blocker
  duplicate: minor
  terminology: minor
  missing_topic: major
  traceability: minor

# Потолок серьёзности: модель повышает находку выше умолчания, но не выше этого значения.
# Для категорий, которых здесь нет, потолка нет.
max_severity:
  ambiguous: major
  composite: minor
  design_decision: minor
  infeasible: major
  unnecessary: minor
  nonconforming: minor
  duplicate: minor
  terminology: minor
  missing_topic: major
  traceability: minor
