# Разбор документа на блоки с якорями (этап ingest, docs/02-trd.md §4).
# Только общие эвристики: никаких привязок к конкретному документу.

# Регулярные выражения (Python re) для номера пункта в начале абзаца или элемента списка.
# Применяются к исходной строке (после маркера списка) по порядку; номер берётся из группы id.
# В номере обязательно есть цифра, чтобы подписи вроде «**Content-Type:**» номером не считались.
item_patterns:
  # **Ф-1.**  **FR-12:**  **200.**  **4.2.1**
  - '^\*\*(?P<id>(?=[^*\s]*\d)[^*\s]{1,24}?)[.:)]?\*\*'
  # Ф-1.  FR-12:  REQ-001  НФТ-3)  US_7
  - '^(?P<id>[A-Za-zА-Яа-яЁё]{1,8}[-_]?\d+(?:[.\-]\d+)*)[.:)](?=\s)'
  - '^(?P<id>[A-Za-zА-Яа-яЁё]{1,8}-\d+(?:[.\-]\d+)*)(?=\s)'
  # 4.2.1 Текст  (минимум один уровень через точку, чтобы «2024 год» не стал номером)
  - '^(?P<id>\d+(?:\.\d+)+)\.?(?=\s)'

# Подпись пункта нумерованного списка без собственного номера: «п. 3».
ordered_item_label: "п. {n}"

# Первая ячейка строки таблицы становится пунктом якоря, если она похожа на идентификатор:
# совпала с item_patterns или это одно «слово» не длиннее этого числа символов.
table_item_max_len: 40

# Единственный заголовок первого уровня в начале документа считается названием документа
# и не попадает в путь раздела: «Часть A › Функциональные требования › Ф-2».
drop_single_h1_title: true

# Распознавание сканов (--ocr): Tesseract через pymupdf4llm. Нужен установленный tesseract с данными
# языков (rus.traineddata и т. д.); без него — понятная ошибка, а не пустой отчёт.
ocr:
  language: "rus+eng"  # языки Tesseract через «+»
  dpi: 300
